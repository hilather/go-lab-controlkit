# go-lab-controlkit continuous integration.
#
# Branch protection on main requires these job names as status checks:
#   "go vet", "go test -race ./...", "fuzz smoke", "govulncheck",
#   "replace/go.work check".
# An apidiff check becomes required from v1.0.0. Renaming a job breaks the
# required check, so change branch protection in the same PR.
#
# v* tag pushes run the same jobs. The release workflow matches that run
# by commit SHA and tag name. The concurrency group below uses github.ref,
# which is refs/heads/main for a branch push and refs/tags/vX.Y.Z for a
# tag push, so a tag run does not cancel a main run or the reverse.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Matches the consumers' Go pin, so govulncheck covers the standard library
  # they build with. go.mod stays "go 1.26" with no toolchain line.
  GO_VERSION: "1.26.8"
  GOTOOLCHAIN: local
  GOPROXY: https://proxy.golang.org,direct

jobs:
  vet:
    name: go vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: go build
        run: make build

  test-race:
    name: go test -race ./...
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: go test -race ./...
        run: make test-race

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Fuzz smoke
        run: make fuzz-smoke

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: govulncheck
        run: make vulncheck

  gomod:
    name: replace/go.work check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No replace, go.work, require or toolchain; go 1.26
        run: make check-gomod
