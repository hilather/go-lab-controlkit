# go-lab-controlkit tag gate.
#
# Library only: this workflow publishes nothing. No image, no binary, and
# no GitHub Release. workflow_dispatch re-gates one tag and does not publish.
#
# On a v* tag push, CI (.github/workflows/ci.yml) starts its own run. This
# gate keeps the newest run (highest databaseId) whose workflow file is
# ci.yml, event is push, headSha is the tag's peeled commit
# (git rev-parse refs/tags/<tag>^{commit}), and headBranch is the tag name.
# An annotated tag's object SHA is not that commit. A green run of the same
# commit on main does not count. release-gate exits 75 while the matching
# run is absent or not completed. The workflow retries only that status.
# Any other non-zero status is a hard failure. Stderr for a retryable
# status starts with "release-gate: pending" or
# "release-gate: no matching run". A pre-release tag that contains those
# words, such as v0.1.0-pending, does not make a peel or -sha error
# retryable. A completed run must have these jobs with conclusion success,
# by exact name:
#   go vet
#   go test -race ./...
#   fuzz smoke
#   govulncheck
#   replace/go.work check
#
# The tag must match ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$.
# The first step canonicalizes the ref from the environment: trim the
# ends, strip one refs/tags/ prefix, and require that pattern. It does
# not check out the ref. actions/checkout then receives only
# refs/tags/<canonical tag>. A later step peels that tag and requires
# HEAD to be the peeled commit. release-gate -require-ci gets that tag and
# commit as -tag and -sha: GitHub ignores a step env override of GITHUB_SHA,
# GITHUB_REF and GITHUB_REF_NAME, which on workflow_dispatch name the branch.
# docs/releases/<tag>.md must exist and contain a Markdown heading that
# includes the tag. A heading inside a fenced code block does not count.
# CHANGELOG.md must contain a line "## <tag>".
# "## Unreleased" alone is not a release heading.
#
# Actions expressions are passed through env, with, or concurrency. They
# do not appear in run scripts.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to re-gate (vX.Y.Z or refs/tags/vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.26.9"
  GOTOOLCHAIN: local
  GOPROXY: https://proxy.golang.org,direct

jobs:
  tag-gate:
    name: tag-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Canonicalize release ref
        id: tag
        env:
          RELEASE_REF: ${{ github.event.inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          # Trim ends only. Internal whitespace still fails the pattern.
          ref="${ref#"${ref%%[![:space:]]*}"}"
          ref="${ref%"${ref##*[![:space:]]}"}"
          case "$ref" in
            refs/tags/*) ref="${ref#refs/tags/}" ;;
          esac
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$ref" =~ $re ]]; then
            echo "ref is not a Go module release tag" >&2
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ steps.tag.outputs.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Resolve tag and peeled commit
        id: rev
        env:
          RELEASE_REF: ${{ steps.tag.outputs.ref }}
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          # Trim ends only. Internal whitespace still fails the pattern.
          ref="${ref#"${ref%%[![:space:]]*}"}"
          ref="${ref%"${ref##*[![:space:]]}"}"
          case "$ref" in
            refs/tags/*) ref="${ref#refs/tags/}" ;;
          esac
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$ref" =~ $re ]]; then
            echo "ref is not a Go module release tag" >&2
            exit 1
          fi
          notes="docs/releases/${ref}.md"
          if [ ! -f "$notes" ]; then
            echo "missing release notes ${notes}" >&2
            exit 1
          fi
          sha="$(git rev-parse --verify --end-of-options "refs/tags/${ref}^{commit}")"
          head="$(git rev-parse --verify HEAD)"
          if [ "$head" != "$sha" ]; then
            echo "HEAD ${head} is not the peeled commit ${sha} of ${ref}" >&2
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"

      - name: Reject dirty worktree
        run: git diff --exit-code && git diff --cached --exit-code

      - name: Validate release notes and changelog
        env:
          NOTES: ${{ steps.rev.outputs.notes }}
          TAG: ${{ steps.rev.outputs.ref }}
        run: go run ./scripts/release-gate -notes-only -notes "$NOTES" -tag "$TAG"

      - name: Check module path
        run: go run ./scripts/release-gate -module

      - name: Build release-gate
        run: go build -o "$RUNNER_TEMP/release-gate" ./scripts/release-gate

      - name: Require green CI on this tag push
        env:
          GH_TOKEN: ${{ github.token }}
          # GitHub ignores step env that sets GITHUB_SHA, GITHUB_REF or
          # GITHUB_REF_NAME. On workflow_dispatch those name the branch, so
          # the tag and its peeled commit go in as -tag and -sha.
          RELEASE_TAG: ${{ steps.rev.outputs.ref }}
          RELEASE_SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            echo "release-gate: CI attempt ${i}/70" >&2
            set +e
            "$RUNNER_TEMP/release-gate" -require-ci -tag "$RELEASE_TAG" -sha "$RELEASE_SHA"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            # 75 is release-gate's retryable status. Do not match error text.
            if [ "$status" -eq 75 ]; then
              sleep 30
              continue
            fi
            exit "$status"
          done
          echo "CI run for this tag did not become green" >&2
          exit 1
